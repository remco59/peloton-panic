<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone frame</title>
    <style>
      html, body { margin: 0; height: 100%; background: #090b18; }
      body { display: grid; place-items: center; }
      .phone {
        width: 390px; height: 844px; border-radius: 44px; background: #000;
        padding: 12px; box-shadow: 0 0 0 3px #2a2f55, 0 30px 80px rgba(0,0,0,.6);
      }
      iframe { width: 390px; height: 844px; border: 0; border-radius: 34px; background: #0f1224; display: block; }
    </style>
  </head>
  <body>
    <div class="phone"><iframe id="f"></iframe></div>
    <script>
      // Dev helper used by scripts/screenshots.mts: shows a phone page at true phone width.
      const src = new URLSearchParams(location.search).get('src') || '/play';
      document.getElementById('f').src = src;
    </script>
  </body>
</html>
